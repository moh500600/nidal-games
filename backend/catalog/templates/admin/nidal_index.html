{% extends "admin/index.html" %}
{% block content %}
<div id="nidal-stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px">
{% for label,value in nidal_stats %}<div style="background:#0c1526;color:#e8f4ff;border:1px solid #22d3ee;padding:14px;border-radius:6px"><div style="font-size:12px;color:#22d3ee;letter-spacing:.08em">{{ label }}</div><div style="font-size:28px;font-weight:800">{{ value }}</div></div>{% endfor %}
</div>
{{ block.super }}
{% endblock %}
