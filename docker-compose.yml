services:
  db:
    image: postgres:16
    environment: {POSTGRES_DB: nidal, POSTGRES_USER: nidal, POSTGRES_PASSWORD: change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment: {POSTGRES_DB: nidal, POSTGRES_USER: nidal, POSTGRES_PASSWORD: change-me, POSTGRES_HOST: db, DEBUG: "1"}
    ports: ["8000:8000"]
    depends_on: [db]
    command: sh -c "python manage.py migrate && python manage.py seed_catalog && gunicorn config.wsgi -b 0.0.0.0:8000"
volumes: {pgdata: {}}
